<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صندوق الذكريات</title><style>body{margin:0;min-height:100vh;overflow:hidden;font-family:Tahoma;background:radial-gradient(circle,#7b2855,#10030d 65%);color:white;text-align:center}.stars{position:fixed;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:70px 70px;opacity:.3}.card{position:relative;margin:55px auto 0;width:min(620px,calc(100% - 30px));min-height:580px;padding:25px;display:flex;align-items:center;justify-content:center;border:1px solid #fff3;border-radius:32px;background:#ffffff10;backdrop-filter:blur(15px);box-shadow:0 25px 80px #000b}.icon{font-size:75px}h1{font-size:clamp(32px,8vw,55px)}p{font-size:17px;line-height:2}.box{padding:20px;border:1px solid #ffb0d533;border-radius:22px;background:#ffffff0b;margin:20px}.btn{border:1px solid #fff3;border-radius:18px;padding:14px 22px;margin:6px;background:#ff659522;color:#fff;font-size:16px;font-weight:bold}.gold{background:#f0c76d;color:#281507}.name{letter-spacing:4px;color:#ffc1da;font-size:11px}.bar{position:fixed;top:15px;left:15px;right:15px;height:4px;background:#fff2;z-index:5}.fill{height:100%;background:#ff9dc4;width:0;transition:.5s}</style><body><div class="stars"></div><div class="bar"><div id="fill" class="fill"></div></div><main class="card"><div id="c"></div></main><script>
let s=0,choice='';function draw(){fill.style.width=s/6*100+'%';let h='';if(s==0)h='<div class=icon>🎁</div><div class=name>NOURI × NAZIHA</div><h1>صندوق الذكريات</h1><p>نزيهة… صنعت لكِ صندوقًا صغيرًا، وكل قفل فيه يخفي جزءًا من رسالة من نوري.</p><button class="btn gold" onclick="go(1)">افتحي الصندوق 🔐</button>';if(s==1)h='<div class=icon>💌</div><h1>الرسالة الأولى</h1><div class=box><p>هناك أشخاص يجعلون اليوم العادي أجمل فقط لأنهم موجودون فيه… وأنتِ واحدة منهم بالنسبة لي.</p></div><button class=btn onclick="go(2)">القفل الثاني 🔑</button>';if(s==2)h='<div class=icon>🌹</div><h1>اختاري وردتكِ</h1><p>أي وردة تشبه قلبكِ اليوم؟</p><button class=btn onclick="pick(1)">🌹 الحمراء</button><button class=btn onclick="pick(2)">🤍 البيضاء</button><button class=btn onclick="pick(3)">🌷 الوردية</button>';if(s==3)h='<div class=icon>🕯️</div><h1>رسالة تحت الضوء</h1><div class=box><p>'+(['','اخترتِ الحمراء… أتمنى أن تبقي قوية ومبتسمة دائمًا. ❤️','اخترتِ البيضاء… أتمنى أن يبقى قلبكِ مرتاحًا وهادئًا. 🤍','اخترتِ الوردية… أتمنى أن تبقى في أيامكِ أشياء كثيرة تجعلكِ تبتسمين. 🌷'][choice])+'</p></div><button class=btn onclick="go(4)">أكملي ✨</button>';if(s==4)h='<div class=icon>🌙</div><h1>لحظة هادئة</h1><div class=box><p>تخيلي سماء مليئة بالنجوم، ومكانًا هادئًا لا يوجد فيه سوى الطمأنينة.</p><p><b>وفي هذه اللحظة… ابتسمي.</b></p></div><button class=btn onclick="go(5)">المفتاح الأخير 🔑</button>';if(s==5)h='<div class=icon>🔐</div><h1>الصندوق الأخير</h1><p>بقيت رسالة واحدة فقط… الرسالة التي لم أجد لها مكانًا إلا قلب هذه اللعبة.</p><button class="btn gold" onclick="go(6)">افتحي ❤️</button>';if(s==6)h='<div class=icon>❤️</div><div class=name>FROM NOURI TO NAZIHA</div><h1>أجمل ذكرى</h1><div class=box><p>كنتِ تبحثين عن الذكرى الأخيرة… لكن الحقيقة أن أجمل ذكرى في هذه القصة كلها هي <b>أنتِ.</b></p><p>صنعتُ هذه اللعبة لأنني أردت أن أترك لكِ شيئًا صغيرًا يقول: فكرتُ فيكِ، وابتسمتُ، ثم قررت أن أصنع لكِ هذه اللحظة. 🌹</p><p><b>من نوري إلى نزيهة ❤️</b><br>أتمنى أن تبقى ابتسامتكِ أجمل نهاية لأي قصة.</p></div><button class=btn onclick="s=0;draw()">إعادة الذكرى ↻</button>';c.innerHTML=h}function go(n){s=n;draw()}function pick(n){choice=n;go(3)}draw();
</script></body></html>
