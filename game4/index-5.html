<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدينة الرسائل الضائعة — نوري × نزيهة</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fff;font-family:Tahoma,Arial,sans-serif;background:#07030b;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-3;background:radial-gradient(circle at 50% 15%,#b83d7138,transparent 32%),radial-gradient(circle at 20% 80%,#5930a030,transparent 30%),linear-gradient(150deg,#08020d,#1b0920 48%,#050207)}
body:after{content:"";position:fixed;inset:0;z-index:-2;opacity:.35;background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(#ffd7ea 1px,transparent 1px);background-size:90px 90px,157px 157px}
.top{position:fixed;top:0;left:0;right:0;height:6px;background:#ffffff12;z-index:20}.bar{height:100%;width:0;background:linear-gradient(90deg,#ff75ad,#ffd39c);transition:.5s}
.wrap{width:min(760px,calc(100% - 24px));margin:34px auto;padding-bottom:35px}
.card{min-height:720px;padding:28px 20px;border:1px solid #fff2;border-radius:34px;background:#ffffff0b;backdrop-filter:blur(17px);box-shadow:0 30px 100px #000c;display:flex;align-items:center;justify-content:center}
.content{width:100%;text-align:center;animation:appear .5s ease}
@keyframes appear{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.chapter{font-size:11px;letter-spacing:3px;color:#ffb9d6;margin-bottom:8px}.icon{font-size:74px;filter:drop-shadow(0 0 25px #ff70a8)}
h1{font-size:clamp(30px,8vw,58px);margin:10px 0 20px}
h2{font-size:27px;margin:10px}.text{font-size:17px;line-height:2.05;color:#f1dce8;max-width:620px;margin:12px auto}
.box{max-width:620px;margin:18px auto;padding:22px;border-radius:23px;border:1px solid #ffb5d52b;background:#ffffff09}
button{border:1px solid #ffffff22;border-radius:17px;padding:14px 20px;margin:6px;color:white;background:#ffffff0c;font-size:15px;font-weight:bold;cursor:pointer;transition:.2s}
button:hover{transform:translateY(-3px);background:#ff79aa22}
.primary{background:linear-gradient(135deg,#ff78ad,#9d4776);box-shadow:0 8px 30px #ff4d8c24}
.gold{background:linear-gradient(135deg,#ffe7a2,#c88c3f);color:#281505}
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.choice{min-width:145px}
input{width:min(450px,90%);padding:15px;border-radius:15px;border:1px solid #fff3;background:#0005;color:white;text-align:center;font-size:17px;outline:none}
.small{font-size:13px;color:#c9adbb}.heart{font-size:42px;letter-spacing:10px}.hidden{display:none}
.inventory{position:fixed;bottom:12px;left:12px;right:12px;z-index:10;text-align:center;font-size:12px;color:#d9bdcb}
.pill{display:inline-block;padding:6px 10px;margin:3px;border-radius:20px;background:#ffffff12;border:1px solid #fff1}
.fade{animation:fade 1.2s infinite alternate}@keyframes fade{to{opacity:.55}}
</style>
</head>
<body>
<div class="top"><div id="bar" class="bar"></div></div>
<div class="wrap"><main class="card"><div id="game" class="content"></div></main></div>
<div id="inv" class="inventory"></div>

<script>
const state={scene:0,trust:0,keys:0,letters:0,choice:"",name:"نزيهة"};
const total=12;
const game=document.getElementById("game"), bar=document.getElementById("bar"), inv=document.getElementById("inv");

function setProgress(){bar.style.width=Math.min(100,(state.scene/total)*100)+"%";inv.innerHTML=""+(state.keys?"<span class=pill>🔑 مفاتيح: "+state.keys+"</span>":"")+" "+(state.letters?"<span class=pill>💌 رسائل: "+state.letters+"</span>":"");}
function render(){setProgress(); let h="";
switch(state.scene){
case 0:h=`<div class=icon>🌙</div><div class=chapter>THE LOST LETTERS</div><h1>مدينة الرسائل الضائعة</h1><p class=text>نزيهة، تخيلي أنكِ استيقظتِ في مدينة غريبة لا يزورها أحد بعد منتصف الليل… وفي يدكِ رسالة واحدة مكتوب عليها: <b>«إذا وصلتِ إلى هنا، فهناك شيء جميل ينتظركِ.»</b></p><button class="primary" onclick="go(1)">دخول المدينة ✨</button>`;break;
case 1:h=`<div class=icon>🏙️</div><div class=chapter>الفصل الأول · المدينة</div><h1>الشارع الذي لا ينام</h1><p class=text>أضواء صغيرة معلقة بين المباني، نافورة هادئة، وثلاثة طرق أمامكِ. لا يوجد أحد… لكنكِ تسمعين موسيقى بعيدة.</p><div class=choices><button class=choice onclick="pick('المكتبة',1)">📚 المكتبة القديمة</button><button class=choice onclick="pick('المحطة',0)">🚉 محطة القطار</button><button class=choice onclick="pick('الحديقة',2)">🌹 الحديقة المضيئة</button></div>`;break;
case 2:h=`<div class=icon>${state.choice==="المكتبة"?"📚":state.choice==="الحديقة"?"🌹":"🚉"}</div><div class=chapter>الفصل الثاني · أول أثر</div><h1>${state.choice}</h1><div class=box><p class=text>${state.choice==="المكتبة"?"وجدتِ كتابًا مفتوحًا، وفي داخله ورقة: «أحيانًا لا نحتاج إلى أن نجد الشخص… يكفي أن نجد أثره.» وبين الصفحات مفتاح صغير.":state.choice==="الحديقة"?"على مقعد تحت شجرة ورد وجدتِ ظرفًا يحمل اسمكِ. داخله مفتاح ورسالة قصيرة: «أحسنتِ اختيار المكان الذي يشبه القلب.»":"وصل قطار بلا ركاب. عند الباب ظرف صغير ومفتاح، وعلى الظرف: «حتى الطرق البعيدة قد تقود إلى شيء قريب من القلب.»"}</p></div><button class=primary onclick="go(3)">أخذ المفتاح 🔑</button>`;break;
case 3:state.keys=1;h=`<div class=icon>🔑</div><div class=chapter>الفصل الثالث · الباب</div><h1>غرفة الساعة</h1><p class=text>تجدين بابًا أسود عليه ثلاث ساعات مرسومة. فوقه جملة: <b>«الوقت الذي يبقى في الذاكرة ليس الأطول… بل الأجمل.»</b></p><div class=box><p class=small>لغز بسيط: أي شيء يقيس الوقت لكنه لا يستطيع إيقافه؟</p><input id=answer placeholder="اكتبي الإجابة"><br><button class=primary onclick="solve()">إجابة</button><p id=hint class=small></p></div>`;break;
case 4:h=`<div class=icon>🕰️</div><div class=chapter>الفصل الرابع · السر</div><h1>الغرفة التي تحفظ الذكريات</h1><p class=text>تفتح الساعة بابًا مخفيًا. على الجدران صور لسماء، بحر، وردة، ونجمة. وفي الوسط صندوق يقول: «اختاري الصورة التي ستتذكرينها إذا أردتِ أن تبتسمي.»</p><div class=choices><button class=choice onclick="memory('السماء')">🌌 السماء</button><button class=choice onclick="memory('البحر')">🌊 البحر</button><button class=choice onclick="memory('الوردة')">🌹 الوردة</button><button class=choice onclick="memory('النجمة')">⭐ النجمة</button></div>`;break;
case 5:h=`<div class=icon>💌</div><div class=chapter>الفصل الخامس · الرسالة</div><h1>رسالة لم تصل</h1><div class=box><p class=text>«نزيهة… لو كان بإمكاني إرسال رسالة واحدة فقط إلى شخص جعل يومي أجمل، فلن أكتب كلامًا كثيرًا. سأكتب: شكرًا لأن وجودكِ جعل لبعض الأيام معنى مختلفًا.»</p></div><button class=primary onclick="go(6)">إلى الرسالة التالية 💗</button>`;break;
case 6:h=`<div class=icon>🎠</div><div class=chapter>الفصل السادس · منتصف الليل</div><h1>مدينة الألعاب المهجورة</h1><p class=text>تعمل لعبة دوارة وحدها. على ثلاثة مقاعد توجد ثلاث كلمات: <b>الصدق، الضحكة، الذكرى.</b> اختاري الكلمة التي تعتقدين أنها تبقى أطول.</p><div class=choices><button onclick="choiceWord('الصدق')">🤍 الصدق</button><button onclick="choiceWord('الضحكة')">😊 الضحكة</button><button onclick="choiceWord('الذكرى')">✨ الذكرى</button></div>`;break;
case 7:h=`<div class=icon>🌧️</div><div class=chapter>الفصل السابع · المطر</div><h1>المظلة الحمراء</h1><p class=text>بدأ المطر. تجدين مظلة واحدة ورسالة تحتها: «إذا كنتِ ستكملين الطريق، خذي شيئًا يحميكِ من المطر… ولا تنسي أن بعض العواصف تمر مهما بدت طويلة.»</p><button class=primary onclick="go(8)">أكمل الطريق ☂️</button>`;break;
case 8:h=`<div class=icon>🌌</div><div class=chapter>الفصل الثامن · المرصد</div><h1>ألف نجمة</h1><p class=text>تصعدين إلى أعلى المدينة. من هناك ترين السماء كاملة. يظهر على الزجاج سؤال أخير: <b>«لو كان بإمكانكِ حفظ لحظة واحدة إلى الأبد، ماذا تختارين؟»</b></p><div class=choices><button onclick="star('لحظة ضحك')">ضحكة لا تُنسى</button><button onclick="star('لحظة هدوء')">لحظة هدوء</button><button onclick="star('لحظة لقاء')">لحظة لقاء</button></div>`;break;
case 9:h=`<div class=icon>🚪</div><div class=chapter>الفصل التاسع · الباب الأخير</div><h1>قبل النهاية</h1><p class=text>أمامكِ باب لا يفتح بمفتاح. عليه جملة واحدة: <b>«الأبواب الجميلة لا تُفتح بالقوة، بل بالكلمة المناسبة.»</b></p><div class=box><input id=word placeholder="اكتبي كلمة من القلب"><br><button class=primary onclick="finalDoor()">فتح الباب ❤️</button><p id=doorHint class=small></p></div>`;break;
case 10:h=`<div class=icon>🏡</div><div class=chapter>الفصل العاشر · المكان السري</div><h1>بيت الذكريات</h1><p class=text>ينفتح الباب على بيت صغير فوق المدينة. لا توجد كنوز ولا مجوهرات. فقط عشرات الرسائل المعلقة، وكل واحدة تبدأ بكلمة: «أتمنى أن…»</p><div class=box><p class=text>أتمنى أن تجدي في أيامكِ سببًا للضحك.<br>أتمنى أن تكوني بخير حتى في الأيام الصعبة.<br>أتمنى أن تعرفي أن التفاصيل الصغيرة قد تصنع أجمل الذكريات.</p></div><button class=primary onclick="go(11)">الرسالة الأخيرة 💌</button>`;break;
case 11:h=`<div class=icon>🕊️</div><div class=chapter>الفصل الأخير · الفجر</div><h1>عندما طلعت الشمس</h1><p class=text>انتهت الرحلة. المدينة بدأت تختفي مع أول ضوء للفجر، لكن بقي ظرف واحد باسمكِ.</p><button class=gold onclick="go(12)">افتحي الظرف ✨</button>`;break;
case 12:h=`<div class=icon>❤️</div><div class=chapter>نهاية القصة · نوري × نزيهة</div><h1>ليست النهاية…</h1><div class=box><p class=text>«نزيهة، هذه المدينة كانت خيالية، لكن الرسالة التي وراءها حقيقية: بعض الأشخاص لا يحتاجون إلى أن يفعلوا شيئًا كبيرًا حتى يتركوا أثرًا جميلًا.»</p><p class=text><b>وأنتِ كنتِ أجمل جزء في هذه الرحلة.</b></p><p class=text>شكرًا لأنكِ أكملتِ الطريق حتى النهاية. 🌹<br>— نوري</p></div><div class=heart>🌹 ✨ 🌹</div><button onclick="go(0)">ابدئي الرحلة من جديد ↻</button>`;break;
}
game.innerHTML=h;setProgress();}
function go(n){state.scene=n;render();window.scrollTo(0,0)}
function pick(x,t){state.choice=x;state.trust+=t;go(2)}
function solve(){let a=(document.getElementById("answer").value||"").trim().toLowerCase();if(a.includes("ساعة")||a.includes("الساعة")||a.includes("الوقت")){state.keys++;go(4)}else document.getElementById("hint").textContent="تلميح: شيء نراه في كل بيت تقريبًا، وله عقارب أحيانًا. 🕰️"}
function memory(x){state.choice=x;state.letters++;go(5)}
function choiceWord(x){if(x==="الصدق")state.trust+=2;else if(x==="الذكرى")state.trust+=1;go(7)}
function star(x){state.trust+=x==="لحظة لقاء"?2:1;go(9)}
function finalDoor(){let x=(document.getElementById("word").value||"").trim();if(x.length>=2){state.trust++;go(10)}else document.getElementById("doorHint").textContent="اكتبي كلمة واحدة على الأقل من قلبك ❤️"}
render();
</script>
</body></html>
